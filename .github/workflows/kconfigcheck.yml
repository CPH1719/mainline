name: Run pmOS kconfigcheck
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - qcom-sdm660-6.*.y
      - qcom-sdm660-7.*.y
    tags:
      - v*-sdm660
  workflow_dispatch:

jobs:
  check-config:
    runs-on: ubuntu-latest
    steps:
      - name: Update ubuntu packages
        run: |
          sudo apt update
          sudo apt -y upgrade
          sudo apt -y autoremove
          # Install build tools and pmbootstrap dependencies
          sudo apt -y install clang lld python3-pip

      - name: Print debug info and do some pre-run checks
        run: |
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "GITHUB_BASE_REF: $GITHUB_BASE_REF"
          echo "GITHUB_HEAD_REF: $GITHUB_HEAD_REF"
          echo "GITHUB_REF: $GITHUB_REF"
          echo -n "whoami: " ; whoami
          echo -n "groups: " ; groups
          echo -n "gcc version: "; gcc --version
          echo -n "clang version: "; clang --version
          echo -n "lld version: "; ld.lld --version

      - name: Checkout linux source from git
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: |
            arch/arm64/configs/sdm660_defconfig

      - name: List all changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          for file in ${ALL_CHANGED_FILES}; do
            echo "  $file was changed"
          done

      - name: Prepare linux kernel config for LLVM using sdm660_defconfig
        run: |
          mkdir -p .output
          rm -f .output/.config .output/defconfig
          make O=.output ARCH=arm64 LLVM=1 LOCALVERSION= defconfig sdm660_defconfig
          make O=.output ARCH=arm64 LLVM=1 LOCALVERSION= savedefconfig
          cat .output/defconfig

      - name: Setup pmbootstrap and pmaports
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          # Clone pmbootstrap and pmaports into the workspace
          git clone --depth=1 https://gitlab.com/postmarketOS/pmbootstrap.git
          git clone --depth=1 https://gitlab.com/postmarketOS/pmaports.git
          # Install pmbootstrap Python dependencies
          pip3 install --user -r pmbootstrap/requirements.txt
          # Add pmbootstrap to PATH
          echo "$GITHUB_WORKSPACE/pmbootstrap" >> $GITHUB_PATH
          # Configure pmbootstrap to use the local pmaports
          pmbootstrap config aports "$GITHUB_WORKSPACE/pmaports"
          pmbootstrap config work "$GITHUB_WORKSPACE/.pmbootstrap-work"
          pmbootstrap --version

      - name: Run kconfigcheck
        if: steps.changed-files.outputs.any_changed == 'true'
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE
          pmbootstrap kconfig check --arch aarch64 --keep-going --categories=default,community --file .output/.config

      - name: Cleanup pmbootstrap chroots
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          pmbootstrap shutdown
